name: CI

on:
  push:
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 계약 시나리오(루트 저장소 contract/). 읽기 전용 배포 키로 받는다.
      # 태그 실행은 같은 이름의 root 태그를 받는다. root 에 그 태그가 없으면 checkout 이 실패하므로 태그는 root 에 먼저 올린다.
      - uses: actions/checkout@v4
        with:
          repository: pdev-jay/nucode-ble-core
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          ssh-key: ${{ secrets.CONTRACT_DEPLOY_KEY }}
          path: .contract-root

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 단위 테스트(공개 API 덤프 대조·가이드 예시 동기화·계약 시나리오 sim 포함) + R8 켠 sample release 빌드
      - name: Test and build
        run: ./gradlew --no-daemon test :sample:assembleRelease -PbleContractDir=.contract-root/contract

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
