# Azure 메인의 main 과 태그를 GitHub 미러(Nucode01/nucode-ble-core-android)로 옮긴다.
# 사람은 Azure 에만 push 한다. 미러의 태그 push 가 GitHub Actions ci·publish 를 돌린다.
# 덮어쓰기·삭제 없이 push 한다. 미러 이력이 갈라지면 push 가 실패로 드러난다.
# 비밀 변수 GITHUB_MIRROR_TOKEN: Nucode01 저장소 contents 쓰기 + workflows 쓰기 권한 토큰(DEVELOPMENT.md).
# batch: 실행 중에 들어온 push 는 그 실행이 끝난 뒤 한 번으로 묶어 겹치는 실행을 줄인다.
trigger:
  batch: true
  branches:
    include:
      - main
  tags:
    include:
      - '*'

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    fetchTags: true
    persistCredentials: false

  # 토큰은 env 로만 받는다. 명령 출력을 켜지 않고, 원격 URL 을 git config 에 남기지 않는다.
  - bash: |
      set -euo pipefail
      git push "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/Nucode01/nucode-ble-core-android.git" \
        "refs/remotes/origin/main:refs/heads/main" \
        "refs/tags/*:refs/tags/*"
    displayName: Push main and tags to GitHub mirror
    env:
      GITHUB_MIRROR_TOKEN: $(GITHUB_MIRROR_TOKEN)
