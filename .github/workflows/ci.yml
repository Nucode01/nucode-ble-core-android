name: CI

on:
  push:
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 단위 테스트(공개 API 덤프 대조·가이드 예시 동기화) + R8 켠 sample release 빌드.
      # 이 workflow 는 GitHub 미러에서 돈다. 미러에는 루트 계약 저장소가 없어 계약 시나리오 sim 은 건너뛴다.
      # 계약 시험은 루트 저장소를 받은 로컬에서 돌린다(DEVELOPMENT.md).
      - name: Test and build
        run: ./gradlew --no-daemon test :sample:assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
